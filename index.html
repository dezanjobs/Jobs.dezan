<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dezan Sanubari | IT Infrastructure Specialist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        nav { z-index: 1000 !important; position: relative; }
        .dropdown-content {
            display: none; position: absolute; right: 0; background-color: #111;
            min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.5); z-index: 9999;
        }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { color: white; padding: 12px 16px; text-decoration: none; display: block; }
        .dropdown-content a:hover { background-color: #333; }
    </style>
</head>
<body>

    <header class="hero" id="home">
        <video autoplay muted loop playsinline class="video-bg" style="z-index:-1">
             <source src="assets/dc-background.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
        <nav class="container">
            <div class="logo"><img src="assets/erasebg-transformed (1).png" alt="Logo"></div>
            <ul class="nav-links mono">
                <li><a href="#home">.home()</a></li>
                <li><a href="#history">.history()</a></li>
                <li><a href="#tools">.tools()</a></li>
                <li class="dropdown">
                    <a href="javascript:void(0)" class="dropbtn"><i class="fas fa-globe"></i> <span id="current-lang">ID</span> ▾</a>
                    <div class="dropdown-content" id="lang-menu">
                        <a href="javascript:void(0)" onclick="changeLang('ID')">Indonesian</a>
                        <a href="javascript:void(0)" onclick="changeLang('EN')">English</a>
                        <a href="javascript:void(0)" onclick="changeLang('JP')">Japanese</a>
                        <a href="javascript:void(0)" onclick="changeLang('CN')">Chinese</a>
                        <a href="javascript:void(0)" onclick="changeLang('AR')">Arabic</a>
                    </div>
                </li>
            </ul>
        </nav>
        <div class="hero-content container">
            <h1 class="hero-title" data-key="hero_title">Dezan Sanubari</h1>
            <p class="subtitle mono" data-key="hero_sub">Operasional Infrastruktur IT & Data Center</p>
            <p class="tagline" data-key="hero_tagline">Keandalan | Konektivitas | Presisi</p>
            <div class="hero-btns">
                <a href="mailto:Jobs.Dezan@gmail.com" class="btn btn-main" data-key="btn_contact">Hubungi Saya</a>
                <a href="assets/CV English 3.0 ATS-compressed_2.pdf" class="btn btn-outline" data-key="btn_cv">Unduh CV</a>
            </div>
        </div>
    </header>

    <main class="container content-section" id="history">
        <span class="section-label mono" data-key="label_history">// professional_experience</span>
        <div class="work-grid" id="work-content"></div>
    </main>

    <script>
        const translations = {
            ID: {
                hero_title: "Dezan Sanubari",
                hero_sub: "Operasional Infrastruktur IT & Data Center",
                hero_tagline: "Keandalan | Konektivitas | Presisi — 12+ Tahun Pengalaman",
                btn_contact: "Hubungi Saya", btn_cv: "Unduh CV", label_history: "// riwayat_kerja",
                jobs: [
                    { year: "2020 - 2025", title: "IT Operations Support", comp: "PT. ValueStream International", desc: "Pemeliharaan UPS/Genset, monitoring link, instalasi server VMware." },
                    { year: "2016 - 2020", title: "Datacenter Specialist", comp: "PT. ValueStream International", desc: "Monitoring infrastruktur DC 24/7 dan pendinginan presisi." },
                    { year: "2015 - 2016", title: "Wi-Fi Support Engineer", comp: "Koperasi Indosat", desc: "Instalasi Access Point Aruba/Ruckus untuk Indosat Super Wi-Fi." },
                    { year: "2012 - 2014", title: "Technical Support", comp: "PT. Persada", desc: "Implementasi jaringan wireless korporat dan troubleshooting." }
                ]
            },
            EN: {
                hero_title: "Dezan Sanubari",
                hero_sub: "IT Infrastructure & Data Center Operations",
                hero_tagline: "Reliability | Connectivity | Precision — 12+ Years Experience",
                btn_contact: "Contact Me", btn_cv: "Download CV", label_history: "// work_history",
                jobs: [
                    { year: "2020 - 2025", title: "IT Operations Support", comp: "PT. ValueStream International", desc: "UPS/Genset maintenance, link monitoring, VMware server installation." },
                    { year: "2016 - 2020", title: "Datacenter Specialist", comp: "PT. ValueStream International", desc: "24/7 DC infrastructure monitoring and precision cooling." },
                    { year: "2015 - 2016", title: "Wi-Fi Support Engineer", comp: "Indosat Cooperative", desc: "Aruba/Ruckus Access Point installation for Indosat Super Wi-Fi." },
                    { year: "2012 - 2014", title: "Technical Support", comp: "PT. Persada", desc: "Corporate wireless network implementation and troubleshooting." }
                ]
            },
            JP: {
                hero_title: "デザン・サヌバリ",
                hero_sub: "ITインフラ・データセンター運用",
                hero_tagline: "信頼性 | 接続性 | 精度 — 12年以上の経験",
                btn_contact: "お問い合わせ", btn_cv: "履歴書をダウンロード", label_history: "// 職歴",
                jobs: [
                    { year: "2020 - 2025", title: "IT運用サポート", comp: "PT. ValueStream International", desc: "UPS/発電機メンテナンス、サーバー設置、VMware運用。" },
                    { year: "2016 - 2020", title: "データセンター専門家", comp: "PT. ValueStream International", desc: "24時間365日のDC監視と精密冷却管理。" },
                    { year: "2015 - 2016", title: "Wi-Fiサポートエンジニア", comp: "Indosat 協同組合", desc: "Indosat Super Wi-Fi用のAruba/Ruckusアクセスポイント設置。" },
                    { year: "2012 - 2014", title: "テクニカルサポート", comp: "PT. Persada", desc: "企業のワイヤレスネットワーク構築とトラブルシューティング。" }
                ]
            },
            CN: {
                hero_title: "Dezan Sanubari",
                hero_sub: "IT 基础设施与数据中心运营",
                hero_tagline: "可靠性 | 连接性 | 精准 — 12年以上经验",
                btn_contact: "联系我", btn_cv: "下载简历", label_history: "// 工作经历",
                jobs: [
                    { year: "2020 - 2025", title: "IT运营支持", comp: "PT. ValueStream International", desc: "UPS/发电机维护、链路监控、VMware服务器安装。" },
                    { year: "2016 - 2020", title: "数据中心专员", comp: "PT. ValueStream International", desc: "24/7 数据中心基础设施监控和精密冷却。" },
                    { year: "2015 - 2016", title: "Wi-Fi技术支持", comp: "Indosat 合作社", desc: "为 Indosat Super Wi-Fi 安装 Aruba/Ruckus 接入点。" },
                    { year: "2012 - 2014", title: "技术支持工程师", comp: "PT. Persada", desc: "企业无线网络实施和故障排除。" }
                ]
            }
        };

        function changeLang(lang) {
            const data = translations[lang] || translations['ID'];
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if(data[key]) el.innerHTML = data[key];
            });

            const workContent = document.getElementById('work-content');
            workContent.innerHTML = data.jobs.map(j => `
                <div class="work-item">
                    <div class="work-year mono">${j.year}</div>
                    <div class="work-info">
                        <h3>${j.title}</h3>
                        <span class="company">${j.comp}</span>
                        <p>${j.desc}</p>
                    </div>
                </div>`).join('');

            document.getElementById('current-lang').innerText = lang;
            localStorage.setItem('selectedLang', lang);
        }

        window.onload = () => {
            const saved = localStorage.getItem('selectedLang') || 'ID';
            changeLang(saved);
        };
    </script>
</body>
</html>
