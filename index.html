<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dezan Sanubari | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="hero" id="home">
        <video autoplay muted loop playsinline class="video-bg">
            <source src="assets/Always seeking new opportuniti..." type="video/mp4">
        </video>
        <div class="overlay"></div>

        <nav class="container">
            <div class="logo">
                <img src="assets/erasebg-transformed.png" alt="Logo">
            </div>
            <ul class="nav-links mono">
                <li><a href="#home">.home()</a></li>
                <li><a href="#history">.history()</a></li>
                <li><a href="#tools">.tools()</a></li>
                <li class="dropdown">
                    <a href="javascript:void(0)" class="dropbtn"><i class="fas fa-globe"></i> <span id="current-lang">ID</span> ▾</a>
                    <div class="dropdown-content" id="lang-menu"></div>
                </li>
            </ul>
        </nav>

        <div class="hero-content container">
            <p class="subtitle mono" data-key="hero_sub">IT Infrastructure & Data Center Operations</p>
            <h1 data-key="hero_name">Dezan Sanubari</h1>
            <p class="tagline" data-key="hero_tagline">Reliability | Connectivity | Precision — 12+ Years Experience</p>
            
            <div class="hero-btns">
                <a href="mailto:Jobs.Dezan@gmail.com" class="btn" data-key="btn_contact">Get In Touch</a>
                <a href="assets/CV English 3.0 ATS-compressed_2.pdf" target="_blank" class="btn btn-outline" data-key="btn_cv">Download CV</a>
            </div>
        </div>
    </header>

    <main class="container content-section" id="history">
        <span class="section-label mono" data-key="label_history">// work_history</span>
        <div class="work-grid" id="work-content">
            </div>
    </main>

    <section id="tools" class="container content-section">
        <span class="section-label mono" data-key="label_tools">// technical_stack_&_edu</span>
        <div class="skills-container" id="skills-content">
            </div>
    </section>

    <footer>
        <div class="container footer-flex">
            <div class="mono" data-key="footer_status">uptime: 12y_experience | dezan.sys</div>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/dezansanubari/" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
            </div>
        </div>
    </footer>

    <script>
        const translations = {
            ID: {
                hero_sub: "Operasional Infrastruktur IT & Data Center",
                hero_tagline: "Keandalan | Konektivitas | Presisi — Pengalaman 12+ Tahun",
                btn_contact: "Hubungi Saya", btn_cv: "Unduh CV",
                label_history: "// riwayat_kerja", label_tools: "// keahlian_&_pendidikan",
                footer_status: "aktif: pengalaman_12_tahun | dezan.sys",
                jobs: [
                    { year: "2016 - 2025", title: "Data Center Operations Engineer", comp: "PT ValueStream International", desc: "Monitoring harian infrastruktur kritis (Server, Network, Power, Cooling). Instalasi VMware, troubleshooting jaringan, dan koordinasi vendor ISP." },
                    { year: "2015 - 2016", title: "Wifi Technical", comp: "Kopindosat", desc: "Instalasi radio wireless, provisioning access point, dan konfigurasi router." },
                    { year: "2012 - 2014", title: "Senior Technical Support", comp: "PT Personal Alih Daya", desc: "Instalasi radio wireless dan support teknis onsite/remote untuk jaringan kantor." }
                ],
                skills: [
                    { title: "Networking", desc: "LAN/WAN, TCP/IP, Fiber Optic, Cisco, Mikrotik, Radio Wireless." },
                    { title: "System & DC", desc: "VMware, Linux, Windows Server, Zabbix Monitoring, DCIM, UPS/Genset." },
                    { title: "Pendidikan", desc: "S1 Teknik Informatika - STMIK Indonesia Mandiri. SMK TKJ - SMK Angkasa 1." }
                ]
            },
            EN: {
                hero_sub: "IT Infrastructure & Data Center Operations",
                hero_tagline: "Reliability | Connectivity | Precision — 12+ Years Experience",
                btn_contact: "Get In Touch", btn_cv: "Download CV",
                label_history: "// work_history", label_tools: "// skills_&_education",
                footer_status: "uptime: 12y_experience | dezan.sys",
                jobs: [
                    { year: "2016 - 2025", title: "Data Center Operations Engineer", comp: "PT ValueStream International", desc: "Daily monitoring of critical infra. VMware installation, network troubleshooting, and ISP vendor coordination." },
                    { year: "2015 - 2016", title: "Wifi Technical", comp: "Kopindosat", desc: "Wireless radio installation, AP provisioning, and router configuration." },
                    { year: "2012 - 2014", title: "Senior Technical Support", comp: "PT Personal Alih Daya", desc: "Radio installation and onsite/remote technical support for office networks." }
                ],
                skills: [
                    { title: "Networking", desc: "LAN/WAN, TCP/IP, Fiber Optic, Cisco, Mikrotik, Radio Wireless." },
                    { title: "System & DC", desc: "VMware, Linux, Windows Server, Zabbix, DCIM, UPS/Cooling." },
                    { title: "Education", desc: "B.Sc Informatics - STMIK Indonesia Mandiri. Voc. High School - SMK Angkasa 1." }
                ]
            }
            // Tambahkan bahasa lain (CN, JP, DE, FR, ES, PT, RU, NL, AR, KR) dengan pola yang sama...
        };

        const languages = [
            {code: 'ID', name: 'Indonesian'}, {code: 'EN', name: 'English'}, {code: 'CN', name: 'Chinese'},
            {code: 'JP', name: 'Japanese'}, {code: 'KR', name: 'Korean'}, {code: 'DE', name: 'German'},
            {code: 'FR', name: 'French'}, {code: 'ES', name: 'Spanish'}, {code: 'PT', name: 'Portuguese'},
            {code: 'RU', name: 'Russian'}, {code: 'NL', name: 'Dutch'}, {code: 'AR', name: 'Arabic'}
        ];

        function initLangMenu() {
            const menu = document.getElementById('lang-menu');
            languages.forEach(l => {
                const a = document.createElement('a');
                a.href = "javascript:void(0)";
                a.innerText = l.name;
                a.onclick = () => changeLang(l.code);
                menu.appendChild(a);
            });
        }

        function changeLang(langCode) {
            document.getElementById('current-lang').innerText = langCode;
            const data = translations[langCode] || translations['EN'];
            
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (data[key]) el.innerText = data[key];
            });

            const workGrid = document.getElementById('work-content');
            const jobs = data.jobs || translations['EN'].jobs;
            workGrid.innerHTML = jobs.map(j => `
                <div class="work-item">
                    <div class="work-year mono">${j.year}</div>
                    <div class="work-info">
                        <h3>${j.title}</h3>
                        <span class="company">${j.comp}</span>
                        <p>${j.desc}</p>
                    </div>
                </div>
            `).join('');

            const skillsGrid = document.getElementById('skills-content');
            const skills = data.skills || translations['EN'].skills;
            skillsGrid.innerHTML = skills.map(s => `
                <div class="skill-card">
                    <h4 class="mono">${s.title}</h4>
                    <p>${s.desc}</p>
                </div>
            `).join('');
            
            document.body.style.direction = (langCode === 'AR') ? 'rtl' : 'ltr';
        }

        window.onload = () => { initLangMenu(); changeLang('ID'); };
    </script>
</body>
</html>
