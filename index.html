<body>

                    <div class="dropdown-content" id="lang-menu">
                        </div>
                </li>
            </ul>
        </nav>

        <div class="hero-content container">
            <p class="subtitle mono" data-key="hero_sub">IT Infrastructure & Data Center Operations</p>
            <h1>Dezan Sanubari</h1>
            <p class="tagline" data-key="hero_tagline">Reliability | Connectivity | Precision — 12+ Years Experience</p>
            
            <div class="hero-btns">
                <a href="mailto:Jobs.Dezan@gmail.com" class="btn" data-key="btn_contact">Get In Touch</a>
                <a href="assets/CV English 3.0 ATS-compressed_2.pdf" target="_blank" class="btn btn-outline" data-key="btn_cv">Download CV</a>
            </div>
        </div>
    </header>

    <main class="container content-section" id="history">
        <span class="section-label mono" data-key="label_history">// work_history</span>
        <div class="work-grid" id="work-content">
            </div>
    </main>

    <section id="tools" class="container content-section">
        <span class="section-label mono" data-key="label_tools">// technical_stack</span>
        <div class="skills-container" id="skills-content">
            </div>
    </section>

    <footer>
        <div class="container footer-flex">
            <div class="mono" data-key="footer_status">uptime: 12y_experience | dezan.sys</div>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/dezansanubari/" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
            </div>
        </div>
    </footer>

    <script>
        const translations = {
            ID: {
                hero_sub: "Operasional Infrastruktur IT & Data Center",
                hero_tagline: "Keandalan | Konektivitas | Presisi — Pengalaman 12+ Tahun",
                btn_contact: "Hubungi Saya", btn_cv: "Unduh CV",
                label_history: "// riwayat_kerja", label_tools: "// keahlian_teknis",
                footer_status: "aktif: pengalaman_12_tahun | dezan.sys",
                jobs: [
                    { year: "2016 - 2025", title: "Data Center Operations Engineer", comp: "PT ValueStream International", desc: "Mengelola infrastruktur kritis, server VMware, dan monitoring 24/7." },
                    { year: "2015 - 2016", title: "Teknisi Wifi", comp: "Kopindosat", desc: "Instalasi perangkat wireless dan konfigurasi jaringan." }
                ],
                skills: [
                    { title: "Jaringan", desc: "LAN, WAN, Fiber Optic, Cisco, Mikrotik." },
                    { title: "Sistem", desc: "VMware, Linux, Windows Server, Zabbix Monitoring." }
                ]
            },
            EN: {
                hero_sub: "IT Infrastructure & Data Center Operations",
                hero_tagline: "Reliability | Connectivity | Precision — 12+ Years Experience",
                btn_contact: "Get In Touch", btn_cv: "Download CV",
                label_history: "// work_history", label_tools: "// technical_stack",
                footer_status: "uptime: 12y_experience | dezan.sys",
                jobs: [
                    { year: "2016 - 2025", title: "Data Center Operations Engineer", comp: "PT ValueStream International", desc: "Managing critical infrastructure, VMware servers, and 24/7 monitoring." },
                    { year: "2015 - 2016", title: "Wifi Technical", comp: "Kopindosat", desc: "Wireless device installation and network configuration." }
                ],
                skills: [
                    { title: "Networking", desc: "LAN, WAN, Fiber Optic, Cisco, Mikrotik." },
                    { title: "Systems", desc: "VMware, Linux, Windows Server, Zabbix Monitoring." }
                ]
            },
            CN: { hero_sub: "IT 基础设施与数据中心运营", hero_tagline: "可靠性 | 连接性 | 精密性 — 12年以上经验", btn_contact: "联系我", btn_cv: "下载简历" },
            JP: { hero_sub: "ITインフラとデータセンター運用", hero_tagline: "信頼性 | 接続性 | 精度 — 12年以上の経験", btn_contact: "お問い合わせ", btn_cv: "履歴書をダウンロード" },
            KR: { hero_sub: "IT 인프라 및 데이터 센터 운영", hero_tagline: "신뢰성 | 연결성 | 정밀성 — 12년 이상의 경험", btn_contact: "문의하기", btn_cv: "이력서 다운로드" },
            DE: { hero_sub: "IT-Infrastruktur & Rechenzentrumbetrieb", hero_tagline: "Zuverlässigkeit | Konnektivität | Präzision", btn_contact: "Kontakt", btn_cv: "Lebenslauf" },
            FR: { hero_sub: "Infrastructure IT & Opérations Data Center", hero_tagline: "Fiabilité | Connectivité | Précision", btn_contact: "Contact", btn_cv: "Télécharger CV" },
            ES: { hero_sub: "Infraestructura TI y Operaciones de Data Center", hero_tagline: "Fiabilidad | Conectividad | Precisión", btn_contact: "Contacto", btn_cv: "Descargar CV" },
            PT: { hero_sub: "Infraestrutura de TI e Operações de Data Center", hero_tagline: "Confiabilidade | Conectividade | Precisão", btn_contact: "Contato", btn_cv: "Baixar CV" },
            RU: { hero_sub: "ИТ-инфраструктура и эксплуатация ЦОД", hero_tagline: "Надежность | Связность | Точность", btn_contact: "Связаться", btn_cv: "Скачать резюме" },
            NL: { hero_sub: "IT-infrastructuur & Data Center Operations", hero_tagline: "Betrouwbaarheid | Connectiviteit | Precisie", btn_contact: "Contact", btn_cv: "Download CV" },
            AR: { hero_sub: "بنية تكنولوجيا المعلومات وتشغيل مراكز البيانات", hero_tagline: "الموثوقية | الاتصال | الدقة", btn_contact: "اتصل بي", btn_cv: "تحميل السيرة الذاتية" }
        };

        const languages = [
            {code: 'ID', name: 'Indonesia'}, {code: 'EN', name: 'English'}, {code: 'CN', name: 'Chinese'},
            {code: 'JP', name: 'Japanese'}, {code: 'KR', name: 'Korean'}, {code: 'DE', name: 'German'},
            {code: 'FR', name: 'French'}, {code: 'ES', name: 'Spanish'}, {code: 'PT', name: 'Portuguese'},
            {code: 'RU', name: 'Russian'}, {code: 'NL', name: 'Dutch'}, {code: 'AR', name: 'Arabic'}
        ];

        function initLangMenu() {
            const menu = document.getElementById('lang-menu');
            languages.forEach(l => {
                const a = document.createElement('a');
                a.href = "#";
                a.innerText = l.name;
                a.onclick = () => changeLang(l.code);
                menu.appendChild(a);
            });
        }

        function changeLang(langCode) {
            document.getElementById('current-lang').innerText = langCode;
            const data = translations[langCode] || translations['EN'];
            
            // Update static text
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (data[key]) el.innerText = data[key];
            });

            // Update Dynamic Content (Jobs)
            const workGrid = document.getElementById('work-content');
            const jobs = data.jobs || translations['EN'].jobs;
            workGrid.innerHTML = jobs.map(j => `
                <div class="work-item">
                    <div class="work-year mono">${j.year}</div>
                    <div class="work-info">
                        <h3>${j.title}</h3>
                        <span class="company">${j.comp}</span>
                        <p>${j.desc}</p>
                    </div>
                </div>
            `).join('');
            
            // RTL Check for Arabic
            document.body.style.direction = (langCode === 'AR') ? 'rtl' : 'ltr';
        }

        window.onload = () => { initLangMenu(); changeLang('ID'); };
    </script>
</body>
</html>
